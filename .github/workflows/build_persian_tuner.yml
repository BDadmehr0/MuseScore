# =============================================================================
#  MuseScore Studio Persian Tuner - Build & Release Workflow
# =============================================================================
#  This workflow builds the persian-tuner branch on every push and
#  uploads the result as a GitHub Release (pre-release for branch
#  pushes, stable for tags).
#
#  Important
#  ---------
#  The file  .github/workflows/build_windows.yml  in this repo has also
#  been patched so that the windows_portable job respects the
#  "platforms" input under workflow_call.  See the condition in that
#  file for details.
# =============================================================================

name: 'Build: Persian Tuner'

on:
  push:
    branches:
      - persian-tuner
    tags:
      - 'v*.*.*-persian'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        default: 'devel'
        type: choice
        options:
          - devel
          - nightly
          - testing
          - stable

concurrency:
  group: persian-tuner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  #   WINDOWS BUILD  (x86_64 only)
  # ------------------------------------------------------------------
  windows_build:
    name: 'Windows x64'
    uses: ./.github/workflows/build_windows.yml
    secrets: inherit
    with:
      # Only build the x64 variant — the portable job is skipped
      # via the patched condition in build_windows.yml
      platforms: 'windows_x64'
      build_mode: ${{ inputs.build_mode || 'devel' }}
      publish: 'off'
      sentry_project: ''
      dockwidgets_v2: 'ON'

  # ------------------------------------------------------------------
  #   CREATE / UPDATE GITHUB RELEASE
  # ------------------------------------------------------------------
  release:
    # Run even if windows_portable (which we skip) would have made
    # the overall job status "failure".  We check for the actual
    # x64 artifact existence inside the steps instead.
    if: ${{ always() }}
    needs: [windows_build]
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: read        # needed to download artifacts from another job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: persian-tuner
          fetch-depth: 0

      # The x64 job uploads its artifact with a name like
      #   MU4_<build-number>_Win_persian-tuner
      # We download ALL artifacts from this run and pick the right one.
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./downloaded-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Find x64 build artifact
        id: find-artifacts
        run: |
          echo "=== All downloaded artifacts ==="
          find ./downloaded-artifacts -type f 2>/dev/null || echo "(empty)"
          echo ""

          # Look for the x64 .7z or .msi or .paf.exe file.
          # Prefer .7z (devel mode output).
          X64_FILE=$(find ./downloaded-artifacts -name '*.7z' -path '*Win*' ! -path '*portable*' 2>/dev/null | head -1)

          if [ -z "$X64_FILE" ]; then
            # Try .msi (testing/stable mode output)
            X64_FILE=$(find ./downloaded-artifacts -name '*.msi' ! -path '*portable*' 2>/dev/null | head -1)
          fi

          if [ -z "$X64_FILE" ]; then
            # Last resort — any file at all
            X64_FILE=$(find ./downloaded-artifacts -type f 2>/dev/null | head -1)
          fi

          if [ -n "$X64_FILE" ]; then
            echo "Found artifact: $X64_FILE"
            echo "artifact_path=$X64_FILE" >> $GITHUB_OUTPUT
          else
            echo "No build artifact found"
            echo "artifact_path=" >> $GITHUB_OUTPUT
          fi

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            DATE_TAG="$(date -u +'%Y%m%d')"
            VERSION="persian-tuner-${DATE_TAG}-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}"^ 2>/dev/null || echo "")
            if [[ -n "$PREV_TAG" ]]; then
              NOTES=$(git log --oneline --no-decorate "${PREV_TAG}..${{ github.ref_name }}" 2>/dev/null)
            else
              NOTES="Initial release of Persian‑tuner build."
            fi
          else
            NOTES="## ⚠️ Unstable pre‑release build\n\nThis build was automatically produced from the **persian-tuner** branch.\n\n### Changes since last build\n"
            NOTES+=$(git log --oneline --no-decorate -20 "${{ github.sha }}" 2>/dev/null)
          fi
          # Escape % and newlines for JSON
          NOTES="${NOTES//'%'/'%25'}"
          NOTES="${NOTES//$'\n'/'%0A'}"
          NOTES="${NOTES//$'\r'/'%0D'}"
          echo "notes=$NOTES" >> $GITHUB_OUTPUT

      - name: Create / Update Release
        if: ${{ steps.find-artifacts.outputs.artifact_path != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: 'MuseScore Studio – Persian Tuner ${{ steps.version.outputs.version }}'
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          files: ${{ steps.find-artifacts.outputs.artifact_path }}
          fail_on_unmatched_files: false